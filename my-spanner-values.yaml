# ==============================================================================
# Values pre-configured for csestuit-goog/spanner-omni-demo-regional
# ==============================================================================
spannerOmni:
  # Target namespace matching spanner-omni-demo-regional
  namespace: "spanner-ns"

  # Internal service endpoint matching spanner-omni-demo-regional
  # In spanner-omni-demo-regional, the service is "spanner" on port 15000
  deploymentEndpoint: "spanner.spanner-ns.svc.cluster.local:15000"

  # Prometheus service deployed in the "monitoring" namespace
  prometheusAddress: "http://prometheus-service.monitoring.svc.cluster.local:9090"

  # 3 Availability Zones (europe-west4-a, europe-west4-b, europe-west4-c)
  # 3 root servers per zone (9 root servers total in regional cluster)
  rootServersPerZone: 3

  # Safe scale-down: Executes `spanner deployment servers delete` via kubectl exec
  # to drain data partitions before reducing StatefulSet pod counts
  safeScaleDown: true

# Regional 3-Zone StatefulSet Targets (spanner-a, spanner-b, spanner-c)
targets:
  - name: "spanner-a"
    minReplicas: 3
    maxReplicas: 10
    cpuTargetPercent: 65
    storageTargetPercent: 80

  - name: "spanner-b"
    minReplicas: 3
    maxReplicas: 10
    cpuTargetPercent: 65
    storageTargetPercent: 80

  - name: "spanner-c"
    minReplicas: 3
    maxReplicas: 10
    cpuTargetPercent: 65
    storageTargetPercent: 80

# Unified Model: Runs as a CronJob matching Google's GKE Autoscaler Guide
unifiedModel:
  enabled: true
  schedule: "*/2 * * * *"
  configMapName: "autoscaler-config"

# Grafana Dashboard ConfigMap auto-provisioned into monitoring namespace
grafana:
  enabled: true
  namespace: "monitoring"
  extraLabels:
    grafana_dashboard: "1"
