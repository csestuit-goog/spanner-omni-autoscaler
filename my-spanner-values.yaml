# Override file for pointing the autoscaler to your specific Spanner Omni instance
spannerOmni:
  namespace: "production-db"
  deploymentEndpoint: "spanner-omni-service.production-db.svc.cluster.local:15000"
  prometheusAddress: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
  rootServersPerZone: 3
  safeScaleDown: true

targets:
  - name: "spanner-zone-1"
    minReplicas: 3
    maxReplicas: 12
    cpuTargetPercent: 65
    storageTargetPercent: 80

  - name: "spanner-zone-2"
    minReplicas: 3
    maxReplicas: 12
    cpuTargetPercent: 65
    storageTargetPercent: 80
